spring.application.name=baozi-store

# Porta do servidor
server.port=8080

# Banco H2 em arquivo (os dados ficam salvos na pasta ./data entre reinicializações)
spring.datasource.url=jdbc:h2:file:./data/baozi_store
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate: cria/atualiza as tabelas a partir das entidades e mostra o SQL no console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON formatado (indentado) nas respostas
spring.jackson.serialization.indent-output=true
